name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Husky solo aplica en local.
  HUSKY: '0'

jobs:
  validate:
    name: Validar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por SHA (versión indicada en el comentario; todas con >= 7 días de publicadas).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # La versión de pnpm sale de "packageManager" en package.json.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Política de pnpm: el archivo conserva cuarentena de 7 días, fuentes ocultas bloqueadas y sin allowBuilds.
      - name: Política de cadena de suministro
        run: node scripts/check-pnpm-policy.mjs

      # --frozen-lockfile: el lockfile debe estar al día. pnpm aplica minimumReleaseAge,
      # blockExoticSubdeps y bloquea scripts de dependencias (allowBuilds vacío) durante la instalación.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Prettier en CI solo valida: nunca modifica archivos.
      - name: Prettier (solo validar)
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      - name: Pruebas (Vitest)
        run: pnpm run test

      - name: Commitlint
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
